# The release pipeline of smspp-project triggers this one with the version of
# the new tag in SMSPP_VERSION: the source package of that release is built
# for every series in SMSPP_SERIES and uploaded to the PPA.
#
# The upload is signed with the GPG key of the PPA, which the job takes from
# the file variable PPA_GPG_KEY (Settings > CI/CD > Variables, type File,
# protected and masked): without it the job only builds the source package
# and keeps it as an artifact, for an upload by hand.

variables:
  SMSPP_SERIES: resolute

build_source:
  image: ubuntu:26.04
  rules:
    - if: $SMSPP_VERSION
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        debhelper devscripts dput dpkg-dev python3 curl ca-certificates gnupg lsb-release
    # gpg has no terminal here, and its agent would look for one: the key
    # carries no passphrase, so the loopback spares the whole dance
    - mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
    - printf 'pinentry-mode loopback\nno-tty\n' > ~/.gnupg/gpg.conf
    - printf 'allow-loopback-pinentry\ndefault-cache-ttl 3600\nmax-cache-ttl 3600\n'
        > ~/.gnupg/gpg-agent.conf
    - gpgconf --kill gpg-agent || true
    - if [ -n "$PPA_GPG_KEY" ]; then gpg --batch --import "$PPA_GPG_KEY"; fi
    # one signature of nothing, which leaves the passphrase in the agent, so
    # that the signature of the package finds it there and asks no one
    - if [ -n "${PPA_GPG_PASSPHRASE:-}" ]; then
        printf x | gpg --batch --yes --pinentry-mode loopback
          --passphrase "$PPA_GPG_PASSPHRASE" --sign --output /dev/null -;
      fi
  script:
    # the key of the CI does not carry the name of the maintainer, so the
    # signature is told which one to use
    - export SMSPP_SIGN_KEY=$(gpg --list-secret-keys --with-colons
        | awk -F: '/^fpr/{print $10; exit}')
    - if [ -n "$PPA_GPG_KEY" ]; then upload=--upload; else upload=; fi
    - ./mk-ppa-source "$SMSPP_VERSION" $SMSPP_SERIES $upload
  artifacts:
    paths:
      - ppa-$SMSPP_VERSION/*.dsc
      - ppa-$SMSPP_VERSION/*.tar.*
      - ppa-$SMSPP_VERSION/*_source.changes
    expire_in: 1 month
